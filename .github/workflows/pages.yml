name: Moduly V1 checks and preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moduly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: pip install -r requirements.lock
      - run: npm ci --ignore-scripts
      - run: python -m unittest discover -s tests -v
      - run: npm run check && npm test
      - name: Build production container
        run: docker build -t moduly:test .
      - name: Check container startup
        run: |
          docker run -d --name moduly-ci -p 127.0.0.1:8000:8000 moduly:test
          python -c "import time,urllib.request; time.sleep(8); print(urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=10).read().decode())"
      - name: Container log on failure
        if: failure()
        run: docker logs moduly-ci || true
      - name: Remove test container
        if: always()
        run: docker rm -f moduly-ci || true
  deploy:
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build static preview allowlist
        run: python3 scripts/build_preview.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy device preview
        id: deployment
        uses: actions/deploy-pages@v4
